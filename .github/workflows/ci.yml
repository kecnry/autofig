name: CI

on:
  push:
  pull_request:

env:
  CONDA_DEPENDENCIES: matplotlib
  PIP_DEPENDENCIES: nose
  PYTHON_VERSION: "2.7"
  NUMPY_VERSION: "1.10"
  ASTROPY_VERSION: "1.0"

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.PYTHON_VERSION == '3.7' && matrix.MATPLOTLIB_VERSION == 'dev' && matrix.NUMPY_VERSION == 'dev' && matrix.ASTROPY_VERSION == 'dev' }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - PYTHON_VERSION: "2.7"
            MATPLOTLIB_VERSION: "1.4.3"
            NUMPY_VERSION: "1.10"
            ASTROPY_VERSION: "1.0"
          - PYTHON_VERSION: "2.7"
            MATPLOTLIB_VERSION: "2.2"
            NUMPY_VERSION: stable
            ASTROPY_VERSION: stable
          - PYTHON_VERSION: "3.6"
            MATPLOTLIB_VERSION: "1.4.3"
            NUMPY_VERSION: stable
            ASTROPY_VERSION: "1.0"
          - PYTHON_VERSION: "3.6"
            MATPLOTLIB_VERSION: "2.2"
            NUMPY_VERSION: stable
            ASTROPY_VERSION: stable
          - PYTHON_VERSION: "3.7"
            MATPLOTLIB_VERSION: dev
            NUMPY_VERSION: dev
            ASTROPY_VERSION: dev
    env:
      PYTHON_VERSION: ${{ matrix.PYTHON_VERSION }}
      MATPLOTLIB_VERSION: ${{ matrix.MATPLOTLIB_VERSION }}
      NUMPY_VERSION: ${{ matrix.NUMPY_VERSION }}
      ASTROPY_VERSION: ${{ matrix.ASTROPY_VERSION }}
    steps:
      - uses: actions/checkout@v4
      - run: export DISPLAY=:99.0
      - run: sh -e /etc/init.d/xvfb start
      - run: if [[ $TRAVIS_OS_NAME == 'osx' ]]; then brew update; fi;
      - run: git clone git://github.com/astropy/ci-helpers.git
      - run: source ci-helpers/travis/setup_conda.sh
      - run: python setup.py build
      - run: python setup.py install --user
      - run: nosetests -v -s -d -w tests/;